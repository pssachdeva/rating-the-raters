name: itemwise_reference_batch
description: |
  Independent item-by-item MHS ratings on the 70-comment reference set.
  Each provider batch contains ten requests per comment, one for each survey item.

subset: reference_set

prompt:
  mode: item_by_item
  system_prompt_path: prompts/mhs_survey_itemwise_v1.txt
  items_path: prompts/mhs_survey_items_v1.yaml

models:
  - id: openai_gpt-5.4_medium
    provider: openai
    name: gpt-5.4
    max_tokens: 2000
    reasoning:
      effort: medium

  - id: google_gemini-3.1-pro-preview_medium
    provider: google
    name: gemini-3.1-pro-preview
    max_tokens: 2048
    reasoning:
      effort: medium

  - id: anthropic_claude-opus-4-6_medium
    provider: anthropic
    name: claude-opus-4-6
    max_tokens: 2048
    reasoning:
      effort: medium

batches:
  run_dir: batches/itemwise_reference_batch
  combined_output_path: data/itemwise_reference_batch_processed.csv
