name: full_set_moonshot_kimi-k2.5_remaining_4096
description: |
  Moonshot/Kimi direct Batch API run for remaining comments after the 50-comment
  smoke test, using the original 4096 completion-token cap.

subset:
  type: comment_ids_file
  path: data/full_set_moonshot_kimi-k2.5_remaining_comment_ids.csv
  column: comment_id

prompt:
  system_prompt_path: prompts/mhs_survey_v1.txt

model:
  id: moonshot_kimi-k2.5
  provider: moonshot
  name: kimi-k2.5
  max_tokens: 4096
  params:
    thinking:
      type: enabled

batches:
  run_dir: batches/full_set_moonshot_kimi-k2.5_remaining_4096
  combined_output_path: data/full_set_moonshot_kimi-k2.5_remaining_4096_processed.csv
