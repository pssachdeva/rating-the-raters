name: item_by_item_anthropic
description: |
  Independent item-by-item MHS ratings on the 70-comment reference set for the
  eight Anthropic model identities included in Figure 1b. Each provider batch
  contains ten requests per comment.

subset: reference_set

prompt:
  mode: item_by_item
  system_prompt_path: prompts/mhs_survey_itemwise_v1.txt
  items_path: prompts/mhs_survey_items_v1.yaml

models:
  - id: anthropic_claude-haiku-4-5
    provider: anthropic
    name: claude-haiku-4-5-20251001
    max_tokens: 2048
    reasoning:
      budget_tokens: 1024

  - id: anthropic_claude-sonnet-4
    provider: anthropic
    name: claude-sonnet-4-20250514
    max_tokens: 2048
    reasoning:
      budget_tokens: 1024

  - id: anthropic_claude-sonnet-4-5
    provider: anthropic
    name: claude-sonnet-4-5-20250929
    max_tokens: 2048
    reasoning:
      budget_tokens: 1024

  - id: anthropic_claude-sonnet-4-6_medium
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 2048
    reasoning:
      effort: medium

  - id: anthropic_claude-opus-4
    provider: anthropic
    name: claude-opus-4-20250514
    max_tokens: 2048
    reasoning:
      budget_tokens: 1024

  - id: anthropic_claude-opus-4-1
    provider: anthropic
    name: claude-opus-4-1-20250805
    max_tokens: 2048
    reasoning:
      budget_tokens: 1024

  - id: anthropic_claude-opus-4-5_medium
    provider: anthropic
    name: claude-opus-4-5-20251101
    max_tokens: 2048
    reasoning:
      effort: medium

  - id: anthropic_claude-opus-4-6_medium
    provider: anthropic
    name: claude-opus-4-6
    max_tokens: 2048
    reasoning:
      effort: medium

batches:
  run_dir: batches/item_by_item/anthropic
  combined_output_path: data/item_by_item/anthropic_processed.csv
