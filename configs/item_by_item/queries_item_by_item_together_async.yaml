name: item_by_item_together_async
description: |
  Independent item-by-item MHS ratings on the reference set for Together-hosted
  open-weight models using individual streaming requests.

subset: reference_set

prompt:
  mode: item_by_item
  system_prompt_path: prompts/mhs_survey_itemwise_v1.txt
  items_path: prompts/mhs_survey_items_v1.yaml

async:
  max_attempts: 3
  retry_delay_seconds: 2.0
  concurrency: 4

models:
  - id: together_openai_gpt-oss-120b
    provider: together
    name: openai/gpt-oss-120b
    max_tokens: 4096
    params:
      reasoning_effort: low

  - id: together_meta-llama_llama-3.3-70b-instruct-turbo
    provider: together
    name: meta-llama/Llama-3.3-70B-Instruct-Turbo
    max_tokens: 4096
    params:
      temperature: 0.5

batches:
  run_dir: batches/item_by_item/together_async
  combined_output_path: data/item_by_item/together_async_processed.csv
